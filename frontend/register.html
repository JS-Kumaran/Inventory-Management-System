<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="src/css/auth.css">
    <style>
        /* Fallback styles */
        body {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 1.5rem;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 2.5rem 2.5rem 2rem;
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-card .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-card .auth-logo .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            border-radius: 50%;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 0.75rem;
            box-shadow: 0 8px 24px rgba(78, 115, 223, 0.3);
        }
        .auth-card .auth-logo h3 {
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 0.25rem;
        }
        .auth-card .auth-logo p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        .auth-form .form-group {
            margin-bottom: 1.25rem;
        }
        .auth-form .form-label {
            font-weight: 600;
            color: #34495e;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            display: block;
        }
        .auth-form .form-control {
            width: 100%;
            padding: 0.65rem 1rem;
            border: 2px solid #e9ecef;
            border-radius: 0.625rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        .auth-form .form-control:focus {
            border-color: #4e73df;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(78, 115, 223, 0.1);
            outline: none;
        }
        .auth-form .form-control.is-invalid {
            border-color: #e74a3b;
            background: #fff5f5;
        }
        .auth-form .form-control.is-valid {
            border-color: #1cc88a;
            background: #f0fff4;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 3rem;
        }
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #adb5bd;
            background: none;
            border: none;
            padding: 0.25rem;
        }
        .password-toggle:hover {
            color: #4e73df;
        }
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            overflow: hidden;
        }
        .password-strength .strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: all 0.5s ease;
        }
        .password-strength .strength-bar.weak { width: 25%; background: #e74a3b; }
        .password-strength .strength-bar.medium { width: 50%; background: #f6c23e; }
        .password-strength .strength-bar.strong { width: 75%; background: #36b9cc; }
        .password-strength .strength-bar.very-strong { width: 100%; background: #1cc88a; }
        .password-strength-label {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-top: 0.25rem;
            display: block;
        }
        .auth-btn {
            width: 100%;
            padding: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 0.625rem;
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(78, 115, 223, 0.4);
        }
        .auth-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }
        .auth-btn .btn-spinner {
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .auth-message {
            padding: 0.75rem 1rem;
            border-radius: 0.625rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        .auth-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .auth-message.error {
            background: #fdf2f2;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .auth-message.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .auth-message.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e9ecef;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: #4e73df;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .d-none { display: none !important; }
        .text-muted { color: #7f8c8d !important; }
        .form-check-input:checked {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        .form-check-label {
            font-size: 0.9rem;
            color: #5a5c69;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon">
                <i class="fas fa-boxes"></i>
            </div>
            <h3>Inventory Management</h3>
            <p>Create your account</p>
        </div>

        <div id="authMessage" class="auth-message">
            <i class="fas message-icon"></i>
            <span id="messageText"></span>
        </div>

        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="firstName" class="form-label">First Name *</label>
                        <input type="text" class="form-control" id="firstName" 
                               placeholder="Enter first name" required autofocus>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="lastName" class="form-label">Last Name *</label>
                        <input type="text" class="form-control" id="lastName" 
                               placeholder="Enter last name" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address *</label>
                <input type="email" class="form-control" id="email" 
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" 
                       placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password *</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" 
                           placeholder="Create a password" required 
                           minlength="6" oninput="checkPasswordStrength(this.value)">
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                        <i class="fas fa-eye" id="passwordToggleIcon"></i>
                    </button>
                </div>
                <div class="password-strength" id="strengthMeter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <small class="password-strength-label" id="strengthLabel">Password must be at least 6 characters</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirm Password *</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="confirmPassword" 
                           placeholder="Confirm your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                        <i class="fas fa-eye" id="confirmPasswordToggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="role" class="form-label">Role</label>
                <select class="form-control" id="role">
                    <option value="staff">Staff</option>
                    <option value="manager">Manager</option>
                    <option value="admin">Admin</option>
                </select>
                <small class="text-muted" style="font-size: 0.75rem;">
                    <i class="fas fa-info-circle me-1"></i>
                    Admin role has full system access
                </small>
            </div>

            <div class="form-group">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="termsCheck" required>
                    <label class="form-check-label" for="termsCheck">
                        I agree to the <a href="#" onclick="showTerms()">Terms and Conditions</a>
                    </label>
                </div>
            </div>

            <button type="submit" class="auth-btn" id="registerBtn">
                <span id="btnText">Create Account</span>
                <span class="btn-spinner d-none" id="btnSpinner"></span>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script>
        var apiBase = 'http://localhost:5000/api';

        function togglePassword(fieldId) {
            var field = document.getElementById(fieldId);
            var icon = document.getElementById(fieldId + 'ToggleIcon');
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                field.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function checkPasswordStrength(password) {
            var strengthBar = document.getElementById('strengthBar');
            var strengthLabel = document.getElementById('strengthLabel');
            
            var strength = 0;
            if (password.length >= 8) strength += 1;
            if (password.length >= 12) strength += 1;
            if (/[a-z]/.test(password)) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 1;
            
            if (password.length === 0) {
                strengthBar.style.width = '0%';
                strengthBar.className = 'strength-bar';
                strengthLabel.textContent = 'Password must be at least 6 characters';
                return;
            }
            
            var level, color;
            if (strength <= 2) { level = 'Weak'; color = 'weak'; }
            else if (strength <= 4) { level = 'Medium'; color = 'medium'; }
            else if (strength <= 6) { level = 'Strong'; color = 'strong'; }
            else { level = 'Very Strong'; color = 'very-strong'; }
            
            strengthBar.style.width = (strength / 7 * 100) + '%';
            strengthBar.className = 'strength-bar ' + color;
            strengthLabel.textContent = 'Strength: ' + level;
        }

        function showMessage(message, type) {
            type = type || 'error';
            var messageEl = document.getElementById('authMessage');
            var textEl = document.getElementById('messageText');
            var iconEl = messageEl.querySelector('.message-icon');
            
            messageEl.className = 'auth-message show ' + type;
            textEl.textContent = message;
            
            var icons = {
                error: 'fa-exclamation-circle',
                success: 'fa-check-circle',
                info: 'fa-info-circle'
            };
            iconEl.className = 'fas message-icon ' + (icons[type] || icons.error);
            
            clearTimeout(messageEl._timeout);
            messageEl._timeout = setTimeout(function() {
                messageEl.classList.remove('show');
            }, 5000);
        }

        async function handleRegister(event) {
            event.preventDefault();

            var firstName = document.getElementById('firstName').value.trim();
            var lastName = document.getElementById('lastName').value.trim();
            var email = document.getElementById('email').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var role = document.getElementById('role').value;
            var termsCheck = document.getElementById('termsCheck').checked;

            var registerBtn = document.getElementById('registerBtn');
            var btnText = document.getElementById('btnText');
            var btnSpinner = document.getElementById('btnSpinner');

            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }

            if (!termsCheck) {
                showMessage('Please agree to the Terms and Conditions', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            registerBtn.disabled = true;
            btnText.textContent = 'Creating account...';
            btnSpinner.classList.remove('d-none');

            try {
                var response = await fetch(apiBase + '/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        phone: phone,
                        password: password,
                        role: role,
                    }),
                });

                var data = await response.json();

                if (response.ok && data.success) {
                    showMessage('Registration successful! Redirecting to login...', 'success');
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message || 'Registration failed. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please check your connection.', 'error');
                console.error('Registration error:', error);
            } finally {
                registerBtn.disabled = false;
                btnText.textContent = 'Create Account';
                btnSpinner.classList.add('d-none');
            }
        }

        function showTerms() {
            alert('Terms and Conditions\n\n' +
                  '1. You agree to use this system responsibly.\n' +
                  '2. You will keep your credentials secure.\n' +
                  '3. You will not share your account with others.\n' +
                  '4. You will follow company policies.\n' +
                  '5. You accept that all activities are logged.');
        }

        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        // Real-time password match validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            var password = document.getElementById('password').value;
            var confirm = this.value;
            if (confirm && password !== confirm) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
            } else if (confirm) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
            } else {
                this.classList.remove('is-invalid', 'is-valid');
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            var confirm = document.getElementById('confirmPassword');
            if (confirm.value) {
                if (this.value !== confirm.value) {
                    confirm.classList.add('is-invalid');
                    confirm.classList.remove('is-valid');
                } else {
                    confirm.classList.remove('is-invalid');
                    confirm.classList.add('is-valid');
                }
            }
        });

        // Email validation
        document.getElementById('email').addEventListener('blur', function() {
            var email = this.value.trim();
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
            } else if (email) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
            }
        });
    </script>
</body>
</html>
