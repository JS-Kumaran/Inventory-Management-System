<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        /* Quick fallback styles if auth.css is missing */
        body {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 1.5rem;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 2.5rem 2.5rem 2rem;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-card .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-card .auth-logo .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            border-radius: 50%;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 0.75rem;
            box-shadow: 0 8px 24px rgba(78, 115, 223, 0.3);
        }
        .auth-card .auth-logo h3 {
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 0.25rem;
        }
        .auth-card .auth-logo p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        .auth-form .form-group {
            margin-bottom: 1.25rem;
        }
        .auth-form .form-label {
            font-weight: 600;
            color: #34495e;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            display: block;
        }
        .auth-form .form-control {
            width: 100%;
            padding: 0.65rem 1rem;
            border: 2px solid #e9ecef;
            border-radius: 0.625rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        .auth-form .form-control:focus {
            border-color: #4e73df;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(78, 115, 223, 0.1);
            outline: none;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 3rem;
        }
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #adb5bd;
            background: none;
            border: none;
            padding: 0.25rem;
        }
        .password-toggle:hover {
            color: #4e73df;
        }
        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.25rem 0;
        }
        .auth-options .form-check-label {
            font-size: 0.9rem;
            color: #5a5c69;
        }
        .auth-options .forgot-link {
            color: #4e73df;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .auth-options .forgot-link:hover {
            text-decoration: underline;
        }
        .auth-btn {
            width: 100%;
            padding: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 0.625rem;
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(78, 115, 223, 0.4);
        }
        .auth-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }
        .auth-btn .btn-spinner {
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .auth-message {
            padding: 0.75rem 1rem;
            border-radius: 0.625rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        .auth-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .auth-message.error {
            background: #fdf2f2;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .auth-message.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .auth-message.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e9ecef;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: #4e73df;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .d-none { display: none !important; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon">
                <i class="fas fa-boxes"></i>
            </div>
            <h3>Inventory Management</h3>
            <p>Sign in to continue</p>
        </div>

        <div id="authMessage" class="auth-message">
            <i class="fas message-icon"></i>
            <span id="messageText"></span>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" 
                       placeholder="Enter your email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" 
                           placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                        <i class="fas fa-eye" id="passwordToggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="auth-options">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                <span id="btnText">Sign In</span>
                <span class="btn-spinner d-none" id="btnSpinner"></span>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            var field = document.getElementById(fieldId);
            var icon = document.getElementById(fieldId + 'ToggleIcon');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                field.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function showMessage(message, type) {
            type = type || 'error';
            var messageEl = document.getElementById('authMessage');
            var textEl = document.getElementById('messageText');
            var iconEl = messageEl.querySelector('.message-icon');
            
            messageEl.className = 'auth-message show ' + type;
            textEl.textContent = message;
            
            var icons = {
                error: 'fa-exclamation-circle',
                success: 'fa-check-circle',
                info: 'fa-info-circle'
            };
            iconEl.className = 'fas message-icon ' + (icons[type] || icons.error);
            
            clearTimeout(messageEl._timeout);
            messageEl._timeout = setTimeout(function() {
                messageEl.classList.remove('show');
            }, 5000);
        }

        async function handleLogin(event) {
            event.preventDefault();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var rememberMe = document.getElementById('rememberMe').checked;

            var loginBtn = document.getElementById('loginBtn');
            var btnText = document.getElementById('btnText');
            var btnSpinner = document.getElementById('btnSpinner');

            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            loginBtn.disabled = true;
            btnText.textContent = 'Signing in...';
            btnSpinner.classList.remove('d-none');

            try {
                var response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email, password: password }),
                });

                var data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    
                    if (rememberMe) {
                        localStorage.setItem('savedEmail', email);
                    }
                    
                    showMessage('Login successful! Redirecting...', 'success');
                    
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showMessage(data.message || 'Invalid credentials. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please check your connection.', 'error');
                console.error('Login error:', error);
            } finally {
                loginBtn.disabled = false;
                btnText.textContent = 'Sign In';
                btnSpinner.classList.add('d-none');
            }
        }

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        // Auto-fill saved email
        var savedEmail = localStorage.getItem('savedEmail');
        if (savedEmail) {
            document.getElementById('email').value = savedEmail;
            document.getElementById('rememberMe').checked = true;
        }

        // Enter key shortcut
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var active = document.activeElement;
                if (active && (active.id === 'email' || active.id === 'password')) {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
