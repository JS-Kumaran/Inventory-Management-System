    <div class="container-fluid mt-4">
        <div id="pageContent"></div>

    <!-- Supplier Modal -->
    <div class="modal fade" id="supplierModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="supplierModalTitle">Add Supplier</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="supplierForm">
                        <input type="hidden" id="supplierId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="supplierName" class="form-label">Name *</label>
                                <input type="text" class="form-control" id="supplierName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="supplierCompany" class="form-label">Company *</label>
                                <input type="text" class="form-control" id="supplierCompany" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="supplierEmail" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="supplierEmail" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="supplierPhone" class="form-label">Phone *</label>
                                <input type="tel" class="form-control" id="supplierPhone" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="supplierTaxId" class="form-label">Tax ID</label>
                            <input type="text" class="form-control" id="supplierTaxId">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <input type="text" class="form-control" id="supplierStreet" placeholder="Street">
                                </div>
                                <div class="col-md-6 mb-2">
                                    <input type="text" class="form-control" id="supplierCity" placeholder="City">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <input type="text" class="form-control" id="supplierState" placeholder="State">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <input type="text" class="form-control" id="supplierZip" placeholder="Zip">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <input type="text" class="form-control" id="supplierCountry" placeholder="Country">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="supplierPaymentTerms" class="form-label">Payment Terms</label>
                                <select class="form-control" id="supplierPaymentTerms">
                                    <option value="net30">Net 30</option>
                                    <option value="net60">Net 60</option>
                                    <option value="net90">Net 90</option>
                                    <option value="cod">COD</option>
                                    <option value="prepaid">Prepaid</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="supplierLeadTime" class="form-label">Lead Time (days)</label>
                                <input type="number" class="form-control" id="supplierLeadTime" value="7">
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="supplierIsActive" checked>
                            <label class="form-check-label" for="supplierIsActive">Active</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveSupplier()">Save Supplier</button>
                </div>
            </div>
        </div>
    </div>
