                        <a class="nav-link" href="categories.html">

                        <ul class="dropdown-menu dropdown-menu-end">

    <!-- Main Content -->
    <div class="container-fluid mt-4">
        <div id="pageContent">
            <!-- Suppliers content will be loaded here by JavaScript -->
        </div>
    </div>

    <!-- Add/Edit Supplier Modal -->
    <div class="modal fade" id="supplierModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="supplierModalTitle">Add Supplier</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="supplierForm">
                        <input type="hidden" id="supplierId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="supplierName" class="form-label">Supplier Name *</label>
                                <input type="text" class="form-control" id="supplierName" required placeholder="John Doe">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="supplierCompany" class="form-label">Company Name *</label>
                                <input type="text" class="form-control" id="supplierCompany" required placeholder="Tech Supplies Inc">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="supplierEmail" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="supplierEmail" required placeholder="john@techsupplies.com">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="supplierPhone" class="form-label">Phone *</label>
                                <input type="tel" class="form-control" id="supplierPhone" required placeholder="+1 234 567 8900">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="supplierTaxId" class="form-label">Tax ID / GSTIN</label>
                            <input type="text" class="form-control" id="supplierTaxId" placeholder="GSTIN-123456789">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <input type="text" class="form-control" id="supplierStreet" placeholder="Street Address">
                                </div>
                                <div class="col-md-6 mb-2">
                                    <input type="text" class="form-control" id="supplierCity" placeholder="City">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <input type="text" class="form-control" id="supplierState" placeholder="State/Province">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <input type="text" class="form-control" id="supplierZip" placeholder="Zip/Postal Code">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <input type="text" class="form-control" id="supplierCountry" placeholder="Country">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="supplierPaymentTerms" class="form-label">Payment Terms</label>
                                <select class="form-control" id="supplierPaymentTerms">
                                    <option value="net30">Net 30</option>
                                    <option value="net60">Net 60</option>
                                    <option value="net90">Net 90</option>
                                    <option value="cod">Cash on Delivery</option>
                                    <option value="prepaid">Prepaid</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="supplierLeadTime" class="form-label">Lead Time (days)</label>
                                <input type="number" class="form-control" id="supplierLeadTime" value="7" min="0">
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="supplierIsActive" checked>
                            <label class="form-check-label" for="supplierIsActive">Active</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveSupplier()">Save Supplier</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Supplier Modal -->
    <div class="modal fade" id="viewSupplierModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Supplier Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewSupplierContent">
                    <!-- Content will be loaded by JavaScript -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="viewSupplierEditBtn" onclick="editSupplierFromView()">
                        <i class="fas fa-edit me-1"></i>Edit
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/suppliers.js"></script>

    <script>
        // Load suppliers when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!localStorage.getItem('token')) {
                window.location.href = '../login.html';
                return;
            }

            // Load user data
            if (typeof loadUserData === 'function') {
                loadUserData();
            }

            // Load suppliers
            if (typeof loadSuppliers === 'function') {
                loadSuppliers();
            }
        });
    </script>
</body>
</html>
