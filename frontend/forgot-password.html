<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h3>Forgot Password</h3>
                <p>Enter your email to reset your password</p>
            </div>

            <div id="authMessage" class="auth-message">
                <i class="fas message-icon"></i>
                <span id="messageText"></span>
            </div>

            <form id="forgotForm" class="auth-form" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" 
                           placeholder="Enter your email" required autofocus>
                </div>

                <button type="submit" class="auth-btn" id="resetBtn">
                    <span id="btnText">Send Reset Link</span>
                    <span class="btn-spinner d-none" id="btnSpinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function showMessage(message, type = 'error') {
            const messageEl = document.getElementById('authMessage');
            const textEl = document.getElementById('messageText');
            const iconEl = messageEl.querySelector('.message-icon');
            
            messageEl.className = 'auth-message show ' + type;
            textEl.textContent = message;
            
            const icons = {
                error: 'fa-exclamation-circle',
                success: 'fa-check-circle',
                info: 'fa-info-circle'
            };
            iconEl.className = 'fas message-icon ' + (icons[type] || icons.error);
            
            clearTimeout(messageEl._timeout);
            messageEl._timeout = setTimeout(() => {
                messageEl.classList.remove('show');
            }, 5000);
        }

        async function handleForgotPassword(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const resetBtn = document.getElementById('resetBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            resetBtn.disabled = true;
            btnText.textContent = 'Sending...';
            btnSpinner.classList.remove('d-none');

            try {
                const response = await fetch('http://localhost:5000/api/auth/forgotpassword', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('Password reset link sent to your email!', 'success');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 3000);
                } else {
                    showMessage(data.message || 'Email not found. Please check and try again.', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please check your connection.', 'error');
            } finally {
                resetBtn.disabled = false;
                btnText.textContent = 'Send Reset Link';
                btnSpinner.classList.add('d-none');
            }
        }

        if (localStorage.getItem('token')) {
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
