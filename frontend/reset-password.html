<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h3>Reset Password</h3>
                <p>Create a new password for your account</p>
            </div>

            <div id="authMessage" class="auth-message">
                <i class="fas message-icon"></i>
                <span id="messageText"></span>
            </div>

            <form id="resetForm" class="auth-form" onsubmit="handleResetPassword(event)">
                <input type="hidden" id="resetToken" value="">

                <div class="form-group">
                    <label for="newPassword" class="form-label">New Password *</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="newPassword" 
                               placeholder="Enter new password" required minlength="6"
                               oninput="checkPasswordStrength(this.value)">
                        <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">
                            <i class="fas fa-eye" id="newPasswordToggleIcon"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="strengthMeter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <small class="password-strength-label" id="strengthLabel">Password must be at least 6 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm New Password *</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="confirmPassword" 
                               placeholder="Confirm new password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye" id="confirmPasswordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="resetBtn">
                    <span id="btnText">Reset Password</span>
                    <span class="btn-spinner d-none" id="btnSpinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                <a href="login.html">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(fieldId + 'ToggleIcon');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                field.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('strengthBar');
            const strengthLabel = document.getElementById('strengthLabel');
            
            let strength = 0;
            if (password.length >= 8) strength += 1;
            if (password.length >= 12) strength += 1;
            if (/[a-z]/.test(password)) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 1;
            
            if (password.length === 0) {
                strengthBar.style.width = '0%';
                strengthBar.className = 'strength-bar';
                strengthLabel.textContent = 'Password must be at least 6 characters';
                return;
            }
            
            let level, color;
            if (strength <= 2) { level = 'Weak'; color = 'weak'; }
            else if (strength <= 4) { level = 'Medium'; color = 'medium'; }
            else if (strength <= 6) { level = 'Strong'; color = 'strong'; }
            else { level = 'Very Strong'; color = 'very-strong'; }
            
            strengthBar.style.width = (strength / 7 * 100) + '%';
            strengthBar.className = 'strength-bar ' + color;
            strengthLabel.textContent = 'Strength: ' + level;
        }

        function showMessage(message, type = 'error') {
            const messageEl = document.getElementById('authMessage');
            const textEl = document.getElementById('messageText');
            const iconEl = messageEl.querySelector('.message-icon');
            
            messageEl.className = 'auth-message show ' + type;
            textEl.textContent = message;
            
            const icons = {
                error: 'fa-exclamation-circle',
                success: 'fa-check-circle',
                info: 'fa-info-circle'
            };
            iconEl.className = 'fas message-icon ' + (icons[type] || icons.error);
            
            clearTimeout(messageEl._timeout);
            messageEl._timeout = setTimeout(() => {
                messageEl.classList.remove('show');
            }, 5000);
        }

        async function handleResetPassword(event) {
            event.preventDefault();

            const token = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const resetBtn = document.getElementById('resetBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            if (!token) {
                showMessage('Invalid reset token. Please request a new reset link.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            resetBtn.disabled = true;
            btnText.textContent = 'Resetting...';
            btnSpinner.classList.remove('d-none');

            try {
                const response = await fetch(`http://localhost:5000/api/auth/resetpassword/${token}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: newPassword }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('Password reset successful! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showMessage(data.message || 'Password reset failed. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please check your connection.', 'error');
            } finally {
                resetBtn.disabled = false;
                btnText.textContent = 'Reset Password';
                btnSpinner.classList.add('d-none');
            }
        }

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            document.getElementById('resetToken').value = token;
        } else {
            showMessage('No reset token found. Please request a new password reset link.', 'error');
        }

        if (localStorage.getItem('token')) {
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
